<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Beeperpay Coin Rush</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#08162d;color:white;font-family:Arial;overflow:hidden;touch-action:none}

canvas{display:block}

#game{position:fixed;inset:0}

#hud{position:absolute;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}

.stat{background:#0b2141dd;border:1px solid #e9bd4d;border-radius:12px;padding:10px;font-weight:bold}

#brand{position:absolute;top:72px;width:100%;text-align:center;color:#f6c64b;letter-spacing:4px;font-weight:900;text-shadow:0 2px 6px #000}

#overlay{position:absolute;inset:0;background:#06152bdc;z-index:5;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}

.card{width:min(100%,440px);max-height:94vh;overflow:auto;background:#10284a;border:2px solid #e5b942;border-radius:22px;padding:20px;text-align:center}

h1{color:#f6c84e;margin:5px;font-size:27px}

button{border:0;border-radius:12px;padding:12px;font-weight:bold;font-size:15px;cursor:pointer}

.primary{background:#eabc42;color:#12213a;width:100%;margin-top:12px}

#characters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}

.person{background:#1a3b65;border:2px solid transparent;border-radius:12px;padding:7px 2px;color:white;min-width:0}

.person.selected{border-color:#ffcc4a;background:#315b85}

.avatar{height:65px;display:flex;align-items:center;justify-content:center;font-size:38px}

.person small{font-size:10px;display:block}

#controls{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 15px;z-index:3;pointer-events:none}

.control{pointer-events:auto;width:55px;height:55px;border-radius:50%;background:#10284add;border:2px solid #edc34d;color:white;font-size:22px}

#rightControls{display:flex;gap:8px}

#hint{position:absolute;bottom:80px;width:100%;text-align:center;font-size:11px;text-shadow:0 2px 4px black;pointer-events:none}

#toast{position:absolute;top:120px;width:100%;text-align:center;color:#ffdc66;font-weight:bold;z-index:4;display:none;font-size:18px}

</style>

</head>

<body>

<div id="game"></div>

<div id="hud">

 <div class="stat">🪙 <span id="coins">0</span></div>

 <div class="stat">🏆 <span id="score">0</span></div>

 <div class="stat">⭐ <span id="best">0</span></div>

</div>

<div id="brand">BEEPERPAY</div>

<div id="toast"></div>

<div id="overlay">

 <div class="card">

  <h1>BEEPERPAY<br>COIN RUSH</h1>

  <p id="intro">Choose your runner!</p>

  <div id="characters"></div>

  <button class="primary" id="start">START RUNNING</button>

  <p style="font-size:11px;color:#b9cce3">Choose your character. Collect coins. Beat your best score!</p>

 </div>

</div>

<div id="hint">Swipe left/right to move · Up to jump · Down to slide</div>

<div id="controls">

 <button class="control" id="left">◀</button>

 <div id="rightControls">

  <button class="control" id="jump">⬆</button>

  <button class="control" id="slide">⬇</button>

  <button class="control" id="right">▶</button>

 </div>

</div>

<script type="importmap">

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}

</script>

<script type="module">

import * as THREE from "three";

const characters=[

 {name:"Joel",gender:"M",skin:0xd49a70,hair:0x20202a,style:"Short hair"},

 {name:"David",gender:"M",skin:0x75442e,hair:0x141414,style:"Curly hair"},

 {name:"Alex",gender:"M",skin:0xf0c59b,hair:0x6b3822,style:"Brown hair"},

 {name:"Sam",gender:"M",skin:0x9a6246,hair:0x1b1520,style:"Fade"},

 {name:"Lina",gender:"F",skin:0xc88961,hair:0x24151c,style:"Ponytail"},

 {name:"Maya",gender:"F",skin:0x71432f,hair:0x17131d,style:"Curly"},

 {name:"Zara",gender:"F",skin:0xf0c39d,hair:0x8a4925,style:"Long hair"},

 {name:"Nia",gender:"F",skin:0x9a654b,hair:0x17121a,style:"Braids"}

];

let selected=0;

const picker=document.getElementById("characters");

characters.forEach((c,i)=>{

 const b=document.createElement("button");

 b.className="person"+(i===0?" selected":"");

 b.innerHTML=`<div class="avatar">${c.gender==="F"?"👩🏽":"👨🏽"}</div><b>${c.name}</b><small>${c.gender==="F"?"Female":"Male"}</small>`;

 b.onclick=()=>{

  selected=i;

  document.querySelectorAll(".person").forEach(x=>x.classList.remove("selected"));

  b.classList.add("selected");

  buildPlayer();

 };

 picker.appendChild(b);

});

const root=document.getElementById("game");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x82b9e0);

scene.fog=new THREE.Fog(0x82b9e0,35,115);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,160);

camera.position.set(0,6,11);

const renderer=new THREE.WebGLRenderer({antialias:true});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

renderer.shadowMap.enabled=true;

root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x4b5268,2));

const sun=new THREE.DirectionalLight(0xffffff,2.2);

sun.position.set(-5,12,8);

sun.castShadow=true;

scene.add(sun);

const mat=(color,metalness=0,roughness=.7)=>new THREE.MeshStandardMaterial({color,metalness,roughness});

const navy=mat(0x102f60);

const gold=mat(0xf4bd35,.7,.25);

const pantsMat=mat(0x202b40);

const road=mat(0x303c4b);

const white=mat(0xffffff);

const dark=mat(0x15243b);

const red=mat(0xe44b43);

const blue=mat(0x0872bc);

const box=(w,h,d,m,x,y,z,parent=scene)=>{

 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);

 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;

};

box(10,.2,180,road,0,-.18,-45);

for(const x of [-1.6,1.6])box(.06,.02,180,white,x,-.06,-45);

for(const x of [-5.2,5.2])box(.3,.5,180,dark,x,0,-45);

for(const side of [-1,1]){

 for(let i=0;i<17;i++){

  const h=5+Math.random()*11;

  const building=box(3,h,5,mat([0x365a7c,0x596b8d,0x27486c][i%3]),side*8,h/2,-i*10-5);

  for(let y=1.5;y<h-1;y+=2){

   for(let x of [-.8,.8]){

    box(.5,.65,.05,mat(0xffd57c,.1,.3),building.position.x+x,y,building.position.z-2.53);

   }

  }

 }

}

let player=new THREE.Group();

scene.add(player);

let legs=[],arms=[];

function buildPlayer(){

 scene.remove(player);

 player=new THREE.Group();

 player.position.set(0,0,2);

 scene.add(player);

 legs=[];arms=[];

 const c=characters[selected];

 const skin=mat(c.skin),hair=mat(c.hair);

 // legs

 for(const x of [-.23,.23])legs.push(box(.24,.75,.27,pantsMat,x,.55,0,player));

 // shoes

 for(const x of [-.23,.23])box(.32,.18,.42,white,x,.16,.04,player);

 // body

 box(.85,1.08,.45,navy,0,1.25,0,player);

 // gold shoulder details

 for(const x of [-.39,.39])box(.1,.5,.47,gold,x,1.45,0,player);

 // head

 const head=new THREE.Mesh(new THREE.SphereGeometry(.34,18,14),skin);

 head.position.set(0,2.08,0);player.add(head);

 // hair cap

 const cap=new THREE.Mesh(new THREE.SphereGeometry(.36,18,10,0,Math.PI*2,0,Math.PI/2),hair);

 cap.position.set(0,2.17,0);player.add(cap);

 // ponytail for female characters

 if(c.gender==="F"){

  const tail=new THREE.Mesh(new THREE.CylinderGeometry(.09,.14,.65,10),hair);

  tail.position.set(0,1.95,.35);tail.rotation.x=-.5;player.add(tail);

 }

 // arms

 for(const x of [-.53,.53])arms.push(box(.2,.78,.22,navy,x,1.3,0,player));

 // gold B emblem on back, facing camera

 const emblem=new THREE.Group();

 emblem.position.set(0,1.35,.24);

 const letter=new THREE.Mesh(new THREE.BoxGeometry(.34,.42,.045),gold);

 emblem.add(letter);

 for(const y of [-.12,.12]){

  const curve=new THREE.Mesh(new THREE.TorusGeometry(.115,.045,8,14,Math.PI),gold);

  curve.rotation.z=Math.PI/2;

  curve.position.set(.1,y,-.025);

  emblem.add(curve);

 }

 player.add(emblem);

}

buildPlayer();

const laneX=[-2.4,0,2.4],objects=[];

let lane=1,targetX=0,jumping=false,sliding=false,jumpTime=0,slideTime=0,runTime=0;

function coin(z,l){

 const g=new THREE.Group();

 const c=new THREE.Mesh(new THREE.TorusGeometry(.34,.11,10,20),gold);

 g.add(c);g.position.set(laneX[l],1.3,z);scene.add(g);

 objects.push({mesh:g,type:"coin"});

}

function obstacle(z,l,type){

 const g=new THREE.Group();

 if(type==="train"){

  box(1.9,2.7,5,blue,0,1.35,0,g);

  box(1.5,.7,.1,white,0,2.1,-2.55,g);

  box(1.9,.2,.2,gold,0,.4,-2.55,g);

 }else if(type==="barrier"){

  box(1.8,.8,.45,red,0,.4,0,g);

  box(2,.12,.5,white,0,.52,0,g);

 }else{

  box(1.9,.2,.3,gold,0,2.05,0,g);

  box(.18,2,.25,dark,-.8,1,0,g);

  box(.18,2,.25,dark,.8,1,0,g);

 }

 g.position.set(laneX[l],0,z);scene.add(g);

 objects.push({mesh:g,type});

}

function spawn(){

 const l=Math.floor(Math.random()*3),r=Math.random();

 if(r<.52){

  for(let j=0;j<4;j++)coin(-85-j*3,l);

 }else obstacle(-85,l,r<.72?"barrier":r<.88?"train":"overhead");

}

let running=false,coins=0,score=0,speed=20,spawnTime=0,best=Number(localStorage.bcrBest||0);

document.getElementById("best").textContent=best;

function hud(){

 document.getElementById("coins").textContent=coins;

 document.getElementById("score").textContent=Math.floor(score);

 document.getElementById("best").textContent=best;

}

function start(){

 objects.forEach(o=>scene.remove(o.mesh));objects.length=0;

 lane=1;targetX=0;player.position.x=0;player.position.y=0;

 coins=0;score=0;speed=20;spawnTime=0;

 jumping=false;sliding=false;running=true;

 document.getElementById("overlay").style.display="none";

 hud();

}

function end(){

 running=false;

 best=Math.max(best,Math.floor(score));

 localStorage.bcrBest=best;

 hud();

 document.querySelector("#overlay h1").innerHTML="RUN OVER!";

 document.getElementById("intro").textContent=`${characters[selected].name}, you collected ${coins} coins and scored ${Math.floor(score)} points.`;

 document.getElementById("start").textContent="PLAY AGAIN";

 document.getElementById("overlay").style.display="flex";

}

function left(){if(running){lane=Math.max(0,lane-1);targetX=laneX[lane]}}

function right(){if(running){lane=Math.min(2,lane+1);targetX=laneX[lane]}}

function jump(){if(running&&!jumping&&!sliding){jumping=true;jumpTime=.65}}

function slide(){if(running&&!jumping&&!sliding){sliding=true;slideTime=.65}}

document.getElementById("start").onclick=start;

document.getElementById("left").onclick=left;

document.getElementById("right").onclick=right;

document.getElementById("jump").onclick=jump;

document.getElementById("slide").onclick=slide;

addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft")left();if(e.key==="ArrowRight")right();

 if(e.key==="ArrowUp"||e.key===" ")jump();if(e.key==="ArrowDown")slide();

});

let tx=0,ty=0;

addEventListener("touchstart",e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY},{passive:true});

addEventListener("touchend",e=>{

 const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;

 if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;

 if(Math.abs(dx)>Math.abs(dy)){dx>0?right():left()}else{dy<0?jump():slide()}

},{passive:true});

function toast(s){

 const t=document.getElementById("toast");t.textContent=s;t.style.display="block";

 setTimeout(()=>t.style.display="none",1600);

}

const clock=new THREE.Clock();

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(running){

  score+=dt*speed*.5;speed=Math.min(34,20+score/180);

  spawnTime+=dt;if(spawnTime>1.1){spawn();spawnTime=0}

  runTime+=dt;

  player.position.x+=(targetX-player.position.x)*Math.min(1,dt*12);

  if(jumping){jumpTime-=dt;player.position.y=Math.sin((.65-jumpTime)/.65*Math.PI)*2;if(jumpTime<=0){jumping=false;player.position.y=0}}

  if(sliding){slideTime-=dt;player.scale.y=.5;if(slideTime<=0){sliding=false;player.scale.y=1}}

  if(!sliding){

   legs[0].rotation.x=Math.sin(runTime*14)*.7;

   legs[1].rotation.x=-Math.sin(runTime*14)*.7;

   arms[0].rotation.x=-Math.sin(runTime*14)*.5;

   arms[1].rotation.x=Math.sin(runTime*14)*.5;

  }

  for(let i=objects.length-1;i>=0;i--){

   const o=objects[i];o.mesh.position.z+=speed*dt;

   if(o.type==="coin")o.mesh.rotation.y+=dt*4;

   if(Math.abs(o.mesh.position.z-2)<1.1&&Math.abs(o.mesh.position.x-player.position.x)<1.05&&!o.hit){

    o.hit=true;

    if(o.type==="coin"){coins++;score+=10;if(coins===1000)toast("🎉 1,000 COINS! DEMO MILESTONE!")}

    else if(!((o.type==="barrier"&&jumping)||(o.type==="overhead"&&sliding)))end();

   }

   if(o.mesh.position.z>13){scene.remove(o.mesh);objects.splice(i,1)}

  }

  hud();

 }

 camera.position.x+=(player.position.x*.18-camera.position.x)*dt*2;

 camera.lookAt(player.position.x*.15,1,-8);

 renderer.render(scene,camera);

}

animate();

addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});

</script>

</body>

</html>
