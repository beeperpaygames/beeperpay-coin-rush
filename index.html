<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Beeperpay Coin Rush</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#07152d;color:white;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}

#game{position:fixed;inset:0}

canvas{display:block}

#hud{position:absolute;top:15px;left:0;right:0;display:flex;justify-content:space-between;padding:12px;pointer-events:none;z-index:3}

.panel{background:#07152ddd;border:1px solid #d5aa42;border-radius:14px;padding:10px 15px;font-weight:bold;box-shadow:0 4px 15px #0005}

#brand{position:absolute;top:75px;left:0;right:0;text-align:center;font-weight:900;letter-spacing:3px;color:#f4c64d;text-shadow:0 2px 5px #000}

#overlay{position:absolute;inset:0;background:linear-gradient(#06142bd9,#06142b99);display:flex;align-items:center;justify-content:center;z-index:5;padding:20px}

.card{background:#10274b;border:2px solid #e5b944;border-radius:24px;padding:28px 22px;text-align:center;width:min(90%,390px);box-shadow:0 12px 40px #0008}

h1{color:#f5c84c;font-size:29px;margin:0 0 10px}

.card p{line-height:1.5;color:#dbe7fa}

button{border:0;border-radius:14px;padding:14px 20px;font-weight:bold;font-size:16px;cursor:pointer}

.primary{background:#e8b83d;color:#14233d;width:100%;margin-top:12px}

#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:4;pointer-events:none}

.control{pointer-events:auto;background:#07152dcc;color:white;border:2px solid #e7bb47;border-radius:50%;width:62px;height:62px;font-size:24px}

#rightControls{display:flex;gap:12px}

#hint{position:absolute;bottom:95px;left:0;right:0;text-align:center;color:white;font-size:12px;text-shadow:0 2px 4px #000;pointer-events:none}

#toast{position:absolute;top:125px;left:0;right:0;text-align:center;color:#ffda63;font-weight:bold;font-size:20px;display:none;z-index:4}

#small{font-size:12px;color:#a9bedb}

</style>

</head>

<body>

<div id="game"></div>

<div id="hud">

 <div class="panel">🪙 <span id="coins">0</span></div>

 <div class="panel">🏆 <span id="score">0</span></div>

 <div class="panel">⭐ <span id="best">0</span></div>

</div>

<div id="brand">BEEPERPAY</div>

<div id="toast"></div>

<div id="overlay">

 <div class="card">

  <h1>BEEPERPAY<br>COIN RUSH</h1>

  <p>Run through the city, collect gold coins and dodge obstacles!</p>

  <p>⬅️ Change lanes · ⬆️ Jump · ⬇️ Slide</p>

  <button class="primary" id="start">START RUNNING</button>

  <p id="small">Original Beeperpay game prototype</p>

 </div>

</div>

<div id="hint">Swipe left/right to move · Swipe up to jump · Swipe down to slide</div>

<div id="controls">

 <button class="control" id="left">◀</button>

 <div id="rightControls">

  <button class="control" id="jump">⬆</button>

  <button class="control" id="slide">⬇</button>

  <button class="control" id="right">▶</button>

 </div>

</div>

<script type="importmap">

{

 "imports":{

  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"

 }

}

</script>

<script type="module">

import * as THREE from "three";

const root=document.getElementById("game");

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x8bc5ed);

scene.fog=new THREE.Fog(0x8bc5ed,35,115);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,180);

camera.position.set(0,6,11);

camera.lookAt(0,1,-8);

const renderer=new THREE.WebGLRenderer({antialias:true});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=THREE.PCFSoftShadowMap;

root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x40516c,2));

const sun=new THREE.DirectionalLight(0xffffff,2.5);

sun.position.set(-5,12,8);

sun.castShadow=true;

scene.add(sun);

const gold=new THREE.MeshStandardMaterial({color:0xf7bd32,metalness:.75,roughness:.22});

const roadMat=new THREE.MeshStandardMaterial({color:0x303b4e,roughness:.9});

const white=new THREE.MeshStandardMaterial({color:0xffffff});

const blue=new THREE.MeshStandardMaterial({color:0x0876c9,roughness:.55});

const dark=new THREE.MeshStandardMaterial({color:0x17243b});

const red=new THREE.MeshStandardMaterial({color:0xe74a42});

const skin=new THREE.MeshStandardMaterial({color:0xd99a69});

const shirt=new THREE.MeshStandardMaterial({color:0x123f85});

const pants=new THREE.MeshStandardMaterial({color:0x202d45});

const box=(w,h,d,mat,x,y,z,parent=scene)=>{

 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);

 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;

 parent.add(m);return m;

};

// Road and city

box(10,.25,180,roadMat,0,-.18,-45);

for(let x of [-1.6,1.6]){

 const line=box(.07,.02,180,white,x,-.045,-45);

 line.material=white;

}

for(let x of [-5.3,5.3])box(.4,.5,180,dark,x,-.05,-45);

const buildings=[];

for(let side of [-1,1]){

 for(let i=0;i<16;i++){

  let h=5+Math.random()*12;

  let b=box(3,h,5,new THREE.MeshStandardMaterial({

   color:[0x38577d,0x596d91,0x274a70,0x7c8da5][i%4]

  }),side*(8+Math.random()*2),h/2-0.1,-i*10-5);

  buildings.push(b);

  for(let y=1.5;y<h-1;y+=2){

   for(let xx=-.8;xx<=.8;xx+=1.6){

    box(.5,.65,.05,new THREE.MeshStandardMaterial({color:0xffd77a,emissive:0x332000}),b.position.x+xx,y,b.position.z-2.53);

   }

  }

 }

}

// Player

const player=new THREE.Group();

scene.add(player);

player.position.set(0,0,2);

const body=box(.8,1.1,.45,shirt,0,1.25,0,player);

const head=new THREE.Mesh(new THREE.SphereGeometry(.36,16,12),skin);

head.position.set(0,2.08,0);head.castShadow=true;player.add(head);

const hair=new THREE.Mesh(new THREE.SphereGeometry(.37,16,8,0,Math.PI*2,0,Math.PI/2),dark);

hair.position.set(0,2.18,0);player.add(hair);

const legs=[];

for(let x of [-.23,.23]){

 let leg=box(.25,.75,.28,pants,x,.55,0,player);legs.push(leg);

}

const arms=[];

for(let x of [-.52,.52]){

 let arm=box(.22,.8,.23,shirt,x,1.3,0,player);arms.push(arm);

}

let lane=1, targetX=0, jumping=false,sliding=false;

let jumpTime=0,slideTime=0,runTime=0;

const laneX=[-2.4,0,2.4];

// Obstacles and coins

const objects=[];

function makeCoin(z,l){

 const g=new THREE.Group();

 const coin=new THREE.Mesh(new THREE.TorusGeometry(.36,.12,10,22),gold);

 coin.rotation.y=Math.PI/2;g.add(coin);

 const core=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.08,20),gold);

 core.rotation.z=Math.PI/2;g.add(core);

 g.position.set(laneX[l],1.25,z);scene.add(g);

 objects.push({mesh:g,type:"coin",lane:l,passed:false});

}

function makeObstacle(z,l,type){

 const g=new THREE.Group();

 if(type==="train"){

  box(1.9,2.7,5,blue,0,1.35,0,g);

  box(1.5,.65,.08,white,0,2.15,-2.55,g);

  box(1.9,.2,.2,gold,0,.45,-2.6,g);

 }else if(type==="barrier"){

  box(1.8,.8,.45,red,0,.4,0,g);

  box(2,.15,.55,white,0,.5,0,g);

 }else{

  box(1.9,.25,.3,gold,0,2.1,0,g);

  box(.18,2,.25,dark,-.8,1,0,g);

  box(.18,2,.25,dark,.8,1,0,g);

 }

 g.position.set(laneX[l],0,z);scene.add(g);

 objects.push({mesh:g,type,lane:l,passed:false});

}

let spawnTimer=0;

function spawn(){

 const laneNo=Math.floor(Math.random()*3);

 const r=Math.random();

 if(r<.45){

  makeCoin(-85,laneNo);

  if(Math.random()<.65)makeCoin(-89,laneNo);

  if(Math.random()<.65)makeCoin(-93,laneNo);

 }else{

  const type=r<.69?"barrier":r<.87?"train":"overhead";

  makeObstacle(-85,laneNo,type);

  if(Math.random()<.5)makeCoin(-92,(laneNo+1)%3);

 }

}

// Game state

let running=false,gameOver=false;

let coins=0,score=0,speed=20,best=Number(localStorage.getItem("bcrBest")||0);

let total=Number(localStorage.getItem("bcrTotal")||0);

document.getElementById("best").textContent=best;

let milestoneShown=false;

function updateHUD(){

 document.getElementById("coins").textContent=coins;

 document.getElementById("score").textContent=Math.floor(score);

 document.getElementById("best").textContent=best;

}

function message(t){

 const el=document.getElementById("toast");

 el.textContent=t;el.style.display="block";

 setTimeout(()=>el.style.display="none",1800);

}

function startGame(){

 for(const o of objects)scene.remove(o.mesh);

 objects.length=0;

 coins=0;score=0;speed=20;spawnTimer=0;

 lane=1;targetX=0;player.position.x=0;

 jumping=false;sliding=false;gameOver=false;

 milestoneShown=false;running=true;

 document.getElementById("overlay").style.display="none";

 updateHUD();

}

function endGame(){

 running=false;gameOver=true;

 best=Math.max(best,Math.floor(score));

 localStorage.setItem("bcrBest",best);

 localStorage.setItem("bcrTotal",total);

 updateHUD();

 document.querySelector(".card h1").innerHTML="RUN OVER!";

 document.querySelector(".card p").innerHTML="You collected "+coins+" coins and scored "+Math.floor(score)+" points.";

 document.getElementById("start").textContent="PLAY AGAIN";

 document.getElementById("overlay").style.display="flex";

}

function moveLeft(){if(running){lane=Math.max(0,lane-1);targetX=laneX[lane]}}

function moveRight(){if(running){lane=Math.min(2,lane+1);targetX=laneX[lane]}}

function jump(){if(running&&!jumping&&!sliding){jumping=true;jumpTime=.65}}

function slide(){if(running&&!jumping&&!sliding){sliding=true;slideTime=.65}}

document.getElementById("start").onclick=startGame;

document.getElementById("left").onclick=moveLeft;

document.getElementById("right").onclick=moveRight;

document.getElementById("jump").onclick=jump;

document.getElementById("slide").onclick=slide;

addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft"||e.key==="a")moveLeft();

 if(e.key==="ArrowRight"||e.key==="d")moveRight();

 if(e.key==="ArrowUp"||e.key===" ")jump();

 if(e.key==="ArrowDown"||e.key==="s")slide();

});

let touchX=0,touchY=0;

addEventListener("touchstart",e=>{

 touchX=e.changedTouches[0].clientX;

 touchY=e.changedTouches[0].clientY;

},{passive:true});

addEventListener("touchend",e=>{

 const dx=e.changedTouches[0].clientX-touchX;

 const dy=e.changedTouches[0].clientY-touchY;

 if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;

 if(Math.abs(dx)>Math.abs(dy)){dx>0?moveRight():moveLeft()}

 else{dy<0?jump():slide()}

},{passive:true});

// Animation

const clock=new THREE.Clock();

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(running){

  score+=dt*speed*.5;

  speed=Math.min(34,20+score/180);

  spawnTimer+=dt;

  if(spawnTimer>1.05){spawn();spawnTimer=0}

  runTime+=dt;

  player.position.x+=(targetX-player.position.x)*Math.min(1,dt*12);

  if(jumping){

   jumpTime-=dt;

   player.position.y=Math.sin((.65-jumpTime)/.65*Math.PI)*2;

   if(jumpTime<=0){jumping=false;player.position.y=0}

  }

  if(sliding){

   slideTime-=dt;player.scale.y=.5;

   if(slideTime<=0){sliding=false;player.scale.y=1}

  }

  if(!sliding){

   legs[0].rotation.x=Math.sin(runTime*14)*.7;

   legs[1].rotation.x=-Math.sin(runTime*14)*.7;

   arms[0].rotation.x=-Math.sin(runTime*14)*.5;

   arms[1].rotation.x=Math.sin(runTime*14)*.5;

  }

  player.rotation.z+=(targetX-player.position.x)*-.03;

  for(let i=objects.length-1;i>=0;i--){

   const o=objects[i];

   o.mesh.position.z+=speed*dt;

   if(o.type==="coin"){

    o.mesh.rotation.y+=dt*4;

    o.mesh.position.y=1.25+Math.sin(runTime*5+i)*.12;

   }

   const close=Math.abs(o.mesh.position.z-player.position.z)<1.1;

   const sameLane=Math.abs(o.mesh.position.x-player.position.x)<1.05;

   if(close&&sameLane&&!o.passed){

    o.passed=true;

    if(o.type==="coin"){

     coins++;total++;

     score+=10;

     localStorage.setItem("bcrTotal",total);

     if(coins===1000&&!milestoneShown){

      milestoneShown=true;

      message("🎉 1,000 COINS! DEMO MILESTONE!");

     }

    }else{

     const safe=(o.type==="barrier"&&jumping)||(o.type==="overhead"&&sliding);

     if(!safe)endGame();

    }

   }

   if(o.mesh.position.z>13){

    scene.remove(o.mesh);objects.splice(i,1);

   }

  }

  updateHUD();

 }

 camera.position.x+=(player.position.x*.18-camera.position.x)*dt*2;

 camera.lookAt(player.position.x*.15,1,-8);

 renderer.render(scene,camera);

}

animate();

addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});

</script>

</body>

</html>
